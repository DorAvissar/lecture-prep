[project]
name = "lecture-prep"
version = "0.1.0"
description = "Daily lecture-prep assistant: reads your calendar, recaps the previous lecture and preps you for the next one, delivered to Telegram."
readme = "README.md"
authors = [{ name = "Dor Avissar", email = "doravissar2@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_prep"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Treat warnings as errors so deprecations surface early.
filterwarnings = [
    "error",
    # Starlette's TestClient nudges toward httpx2; httpx is still supported.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "I", "B", "UP", "SIM"]
