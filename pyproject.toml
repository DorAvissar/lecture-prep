[project]
name = "lecture-prep"
version = "0.1.0"
description = "Daily lecture-prep assistant: reads your calendar, recaps the previous lecture and preps you for the next one, delivered to Telegram."
readme = "README.md"
authors = [{ name = "Dor Avissar", email = "doravissar2@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_prep"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Treat warnings as errors so deprecations surface early.
filterwarnings = [
    "error",
    # Starlette's TestClient nudges toward httpx2; httpx is still supported.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
