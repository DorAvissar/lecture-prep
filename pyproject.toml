[project]
name = "lecture-prep"
version = "0.1.0"
description = "Daily lecture-prep assistant: reads your calendar, recaps the previous lecture and preps you for the next one, delivered to Telegram."
readme = "README.md"
authors = [{ name = "Dor Avissar", email = "doravissar2@gmail.com" }]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_prep"]
