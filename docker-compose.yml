# Local development database: PostgreSQL with the pgvector extension
# (used later for semantic search over lecture content).
# Start with: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lecture_prep
      POSTGRES_PASSWORD: lecture_prep  # local dev only
      POSTGRES_DB: lecture_prep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture_prep"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
